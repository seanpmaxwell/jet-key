name: CI

on:
  push:
    branches: [main, development]
  pull_request:

# A new push to the same branch/PR cancels the run that's still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 20.19 is the floor in `engines`, and also the lowest Node the test
        # toolchain runs on: Vite 8 and rolldown require ^20.19 || >=22.12.
        # The rest are the live majors.
        node: ['20.19', '22', '24', '26']
        include:
          # Cover a second OS and CPU architecture once, on the newest Node:
          # macos-latest runs on Apple silicon (arm64), the Ubuntu jobs on x64.
          - os: macos-latest
            node: '26'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      # `npm test` is the node suite only; the browser suite has its own job
      # below, since it is the one path that reaches TextDecoder.
      - run: npm run test:node
      - run: npm run test:package

  browser:
    name: Browser (system Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - run: npm ci --ignore-scripts

      # No browser download: the config points Playwright at the Chrome the
      # runner already ships. This is the only job that reaches the
      # TextDecoder decode path, since Node always has Buffer.
      - run: npm run test:browser
